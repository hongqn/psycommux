<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1e1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="psycommux">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/app.css">
<title>psycommux</title>
</head>
<body>
<aside id="nav">
  <div class="nav-head">
    <span class="brand">psycommux</span>
    <span id="status" class="bad" title="connecting"></span>
    <button id="newChat" class="ghost" title="New Claude session">✎ New</button>
  </div>
  <input id="filter" type="search" placeholder="Search workspaces" autocomplete="off">
  <div id="wslist"><div class="empty">Loading…</div></div>
</aside>
<div id="scrim"></div>
<main id="main">
  <header id="top">
    <button id="menu" class="icon" title="Workspaces">☰</button>
    <div class="titles"><div id="title">psycommux</div><div id="subtitle"></div></div>
    <div id="actions"></div>
    <button id="bell" class="icon" title="Notifications"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 15.5a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm5.5-4.2-1-1.3V7a4.5 4.5 0 0 0-3.6-4.4V2a.9.9 0 1 0-1.8 0v.6A4.5 4.5 0 0 0 3.5 7v3l-1 1.3a.6.6 0 0 0 .5 1h10a.6.6 0 0 0 .5-1z"/></svg><span id="unreadCount" class="badge" hidden>0</span></button>
  </header>
  <div id="urlbar" hidden>
    <button data-nav="back" class="icon" title="Back">‹</button>
    <button data-nav="forward" class="icon" title="Forward">›</button>
    <button data-nav="reload" class="icon" title="Reload">↻</button>
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button id="readerBtn" class="icon reader-toggle" title="Reader view">Aa</button>
    <button id="openHere" class="icon" title="Open on this device">↗</button>
  </div>
  <section id="view"><div class="empty">Loading…</div></section>
  <footer id="composer">
    <div id="keys"></div>
    <div class="box">
      <button id="attachBtn" class="attach" title="Add photos or files" hidden><svg viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M8 3v10M3 8h10"/></svg></button>
      <input id="attachFile" type="file" multiple hidden>
      <textarea id="input" rows="1" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>
      <button id="micBtn" class="mic" title="Dictate" hidden><svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 10.5A2.5 2.5 0 0 0 10.5 8V3.5a2.5 2.5 0 0 0-5 0V8A2.5 2.5 0 0 0 8 10.5zm4.25-2.6a.75.75 0 0 0-1.5 0 2.75 2.75 0 0 1-5.5 0 .75.75 0 0 0-1.5 0 4.25 4.25 0 0 0 3.5 4.18V14H6a.75.75 0 0 0 0 1.5h4a.75.75 0 0 0 0-1.5H8.75v-1.92a4.25 4.25 0 0 0 3.5-4.18z"/></svg></button>
      <button id="sendBtn" class="send" title="Send">↑</button>
    </div>
  </footer>
</main>
<aside id="notifs">
  <div class="head"><h2>Notifications</h2><button id="jumpUnread">Jump to Latest Unread</button><button id="clearAll">Clear All</button></div>
  <div id="nlist"></div>
  <div class="foot"><span id="pushState">Notifications on this device:</span> <button id="enableNotify">Enable</button> <button id="testPush" hidden>Send a test</button></div>
</aside>
<div id="secrets"></div>
<div id="menuPop" hidden></div>
<script src="/assets/app.js"></script>
</body>
</html>
