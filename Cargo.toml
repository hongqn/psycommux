[package]
name = "psycommux"
version = "0.1.0"
edition = "2024"
description = "Drive cmux from your phone: a small server and an installable web app"
license = "MIT"
repository = "https://github.com/hongqn/psycommux"
rust-version = "1.88"
readme = "README.md"
keywords = ["cmux", "terminal", "remote", "pwa", "claude"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
aes-gcm = "0.10"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.4"
flate2 = "1.1.10"
futures-util = "0.3.34"
glob = "0.3.4"
hkdf = "0.12"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "webpki-tokio", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service", "client-legacy", "http1"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = { version = "1.0.1", features = ["std"] }
sha2 = "0.10"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
url = "2.5.8"
webp = { version = "0.3.1", default-features = false }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
